<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fly Aero — Instagram Post</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body class="fx-page">
  <article class="fx-square">
    <div class="fx-logo"><img src="../img/fly-aero-logo.jpg" alt="Fly Aero"></div>
    <p class="script">Journey beyond</p>
    <h1>ALL TRAVEL. ONE DESK.</h1>
    <div class="fx-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="fx-cell"><i class="fas fa-plane"></i><span>Flights</span></div>
      <div class="fx-cell"><i class="fas fa-passport"></i><span>Visa</span></div>
      <div class="fx-cell"><i class="fas fa-kaaba"></i><span>Umrah</span></div>
      <div class="fx-cell"><i class="fas fa-hotel"></i><span>Hotels</span></div>
      <div class="fx-cell"><i class="fas fa-umbrella-beach"></i><span>Holidays</span></div>
      <div class="fx-cell"><i class="fas fa-headset"></i><span>Support</span></div>
    </div>
    <p class="cta-line">DM @fly_aerotravels · WhatsApp to book</p>
  </article>
</body>
</html>
