<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fly Aero — Holiday &amp; Hotel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body class="fx-page">
  <article class="fx-poster">
    <header class="fx-top">
      <img src="../img/country-3.jpg" class="fx-hero-photo" alt="">
      <div class="fx-logo"><img src="../img/fly-aero-logo.jpg" alt="Fly Aero"></div>
      <p class="fx-eyebrow">Dream getaways</p>
      <h1><span class="script">Holiday</span> &amp; Hotel</h1>
      <p class="fx-sub">Family trips, honeymoons, and group tours — flights, stays, and transfers in one package.</p>
    </header>
    <div class="fx-body">
      <div class="fx-grid cols-3">
        <div class="fx-cell"><i class="fas fa-plane"></i><span>Flights</span></div>
        <div class="fx-cell"><i class="fas fa-hotel"></i><span>Hotels</span></div>
        <div class="fx-cell"><i class="fas fa-umbrella-beach"></i><span>Packages</span></div>
        <div class="fx-cell"><i class="fas fa-shuttle-van"></i><span>Transfers</span></div>
        <div class="fx-cell accent"><i class="fas fa-heart"></i><span>Honeymoon</span></div>
        <div class="fx-cell accent"><i class="fas fa-users"></i><span>Groups</span></div>
      </div>
      <div class="fx-band">
        <div class="icon"><i class="fas fa-suitcase-rolling"></i></div>
        <div class="copy">
          <strong>Let's plan your next adventure</strong>
          <em>Always with you!</em>
        </div>
      </div>
    </div>
    <footer class="fx-foot">
      <div><h3>Book</h3><p>+91 7994100373</p></div>
      <div><h3>UAE</h3><p>+971 54443 6265</p></div>
      <div><h3>IG</h3><p>@fly_aerotravels</p></div>
    </footer>
  </article>
</body>
</html>
